<!-- top30.html (исправленный) -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Топ 30 чаттеров — eendychan</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #0b0b0c;
  --surface: #131314;
  --border: rgba(255,255,255,.06);
  --text: #f4f4f4;
  --soft: rgba(255,255,255,.58);
  --accent: #a970ff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: 100vh;
}

.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  background: #101011;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 28px;
  letter-spacing: -.04em;
}

.logo img {
  height: 32px;
  width: auto;
  border-radius: 8px;
}

.sidebar nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}

.sidebar a {
  text-decoration: none;
  color: var(--soft);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  transition: all .15s;
}

.sidebar a:hover {
  background: rgba(255,255,255,.05);
  color: white;
}

.sidebar-footer {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.sidebar-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #2a2a2e;
  color: var(--soft);
  text-decoration: none;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 500;
  transition: all .2s ease;
  width: 100%;
  border: none;
  cursor: pointer;
}

.sidebar-btn img {
  width: 20px;
  height: 20px;
  object-fit: contain;
}

.sidebar-btn:hover {
  background: #1a1a1e;
  color: white;
}

.content {
  padding: 32px 40px;
  max-width: 1000px;
}

.hero-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: rgba(255,255,255,.35);
  margin-bottom: 8px;
}

h1 {
  font-size: 40px;
  letter-spacing: -.06em;
  margin-bottom: 8px;
  font-weight: 800;
}

.sub {
  color: var(--soft);
  margin-bottom: 32px;
  font-size: 14px;
}

.table-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

th {
  color: var(--soft);
  font-weight: 500;
  background: rgba(255,255,255,.02);
}

tr:last-child td {
  border-bottom: none;
}

.rank {
  width: 60px;
  color: var(--accent);
  font-weight: 700;
}

.username {
  font-weight: 600;
}

.messages {
  text-align: right;
  font-family: monospace;
}

footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--soft);
  text-align: center;
}

@media (max-width: 680px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: relative;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .content {
    padding: 24px;
  }
  h1 {
    font-size: 32px;
  }
}
</style>
</head>
<body>
<div class="layout">

<aside class="sidebar">
  <div>
    <div class="logo">
      <img src="https://ech.s-ul.eu/sye64ZC5" alt="Bot Logo" onerror="this.style.display='none';">
      <span>eendychan</span>
    </div>
    <nav>
      <a href="index.html">🏠 Главная</a>
    </nav>
  </div>
  
  <div class="sidebar-footer">
    <a href="https://bio.site/endychan" target="_blank" class="sidebar-btn">
      <img src="https://ech.s-ul.eu/VZHPPMmm" alt="links" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2720%27 height=%2720%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71%27%3E%3C/path%3E%3Cpath d=%27M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71%27%3E%3C/path%3E%3C/svg%3E'">
      <span>ссылки</span>
    </a>
    <a href="https://t.me/eendychan_bot" target="_blank" class="sidebar-btn">
      <img src="https://cdn.simpleicons.org/telegram/white" alt="telegram" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2720%27 height=%2720%27 viewBox=%270 0 24 24%27 fill=%27white%27%3E%3Cpath d=%27M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.217-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.022c.242-.213-.053-.332-.375-.12l-6.87 4.326-2.96-.924c-.64-.2-.652-.64.135-.953l11.57-4.458c.534-.19 1.005.128.832.941z%27/%3E%3C/svg%3E'">
      <span>телеграм панель</span>
    </a>
    <a href="index.html" class="sidebar-btn" style="background: #2a2a2e; margin-top: 8px;">
      <span>← Назад к документации</span>
    </a>
  </div>
</aside>

<main class="content">
<div class="hero-label">СТАТИСТИКА</div>
<h1>Топ 30 чаттеров</h1>
<div class="sub">За текущий месяц — сообщения в чате</div>

<div class="table-wrapper">
  <table id="top30-table">
    <thead>
      <tr><th>#</th><th>Пользователь</th><th>Сообщений</th></tr>
    </thead>
    <tbody id="top30-list">
      <tr><td colspan="3" style="text-align: center;">Загрузка данных...</td></tr>
    </tbody>
   </table>
</div>

<footer>
  Данные обновляются в начале каждого месяца. Если вы видите тестовые строки — скоро здесь появится реальная статистика.
</footer>
</main>
</div>

<script>
  // Встроенные данные на 30 пользователей (твой пример)
  const fallbackData = {
    top30: [
      {"username": "endychann", "messages": 1542},
      {"username": "ghghh_", "messages": 1203},
      {"username": "makkkena", "messages": 987},
      {"username": "Norv1lMaster", "messages": 876},
      {"username": "user5", "messages": 765},
      {"username": "user6", "messages": 654},
      {"username": "user7", "messages": 543},
      {"username": "user8", "messages": 432},
      {"username": "user9", "messages": 321},
      {"username": "user10", "messages": 298},
      {"username": "user11", "messages": 276},
      {"username": "user12", "messages": 254},
      {"username": "user13", "messages": 232},
      {"username": "user14", "messages": 210},
      {"username": "user15", "messages": 195},
      {"username": "user16", "messages": 180},
      {"username": "user17", "messages": 165},
      {"username": "user18", "messages": 150},
      {"username": "user19", "messages": 135},
      {"username": "user20", "messages": 120},
      {"username": "user21", "messages": 110},
      {"username": "user22", "messages": 100},
      {"username": "user23", "messages": 90},
      {"username": "user24", "messages": 80},
      {"username": "user25", "messages": 70},
      {"username": "user26", "messages": 60},
      {"username": "user27", "messages": 50},
      {"username": "user28", "messages": 40},
      {"username": "user29", "messages": 30},
      {"username": "user30", "messages": 20}
    ]
  };

  function renderTable(data) {
    const tbody = document.getElementById('top30-list');
    tbody.innerHTML = '';
    if (!data.top30 || data.top30.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Нет данных</td></tr>';
      return;
    }
    for (let i = 0; i < data.top30.length; i++) {
      const user = data.top30[i];
      const row = document.createElement('tr');
      const rankCell = document.createElement('td');
      rankCell.className = 'rank';
      rankCell.textContent = (i + 1).toString();
      const nameCell = document.createElement('td');
      nameCell.className = 'username';
      nameCell.textContent = user.username;
      const msgCell = document.createElement('td');
      msgCell.className = 'messages';
      msgCell.textContent = user.messages.toLocaleString();
      row.appendChild(rankCell);
      row.appendChild(nameCell);
      row.appendChild(msgCell);
      tbody.appendChild(row);
    }
    // Если в данных меньше 30, заполняем пустыми строками (опционально)
    if (data.top30.length < 30) {
      for (let i = data.top30.length; i < 30; i++) {
        const row = document.createElement('tr');
        const rankCell = document.createElement('td');
        rankCell.className = 'rank';
        rankCell.textContent = (i + 1).toString();
        const nameCell = document.createElement('td');
        nameCell.textContent = '—';
        const msgCell = document.createElement('td');
        msgCell.className = 'messages';
        msgCell.textContent = '0';
        row.appendChild(rankCell);
        row.appendChild(nameCell);
        row.appendChild(msgCell);
        tbody.appendChild(row);
      }
    }
  }

  // Пытаемся загрузить внешний JSON, если не получается — используем fallback
  async function loadTop30() {
    try {
      const response = await fetch('top30_data.json?_=' + Date.now());
      if (response.ok) {
        const data = await response.json();
        if (data && data.top30 && Array.isArray(data.top30) && data.top30.length > 0) {
          console.log('Загружены данные из top30_data.json');
          renderTable(data);
          return;
        } else {
          console.warn('Файл top30_data.json есть, но формат неверный или пустой. Использую fallback.');
        }
      } else {
        console.warn(`Не удалось загрузить top30_data.json (HTTP ${response.status}). Использую fallback.`);
      }
    } catch (e) {
      console.warn('Ошибка при загрузке top30_data.json:', e);
    }
    // Fallback
    console.log('Использую встроенные данные (fallback)');
    renderTable(fallbackData);
  }

  loadTop30();
</script>
</body>
</html>
